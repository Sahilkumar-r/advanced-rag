# Render blueprint for a free web service built from the Dockerfile in this repo.
# Written from Render's blueprint spec and NOT yet used on a Render account, so the first deploy may need small fixes.
# Secrets are never stored here: `sync: false` means Render asks for the value in its dashboard; JWT_SECRET is generated by Render.
# Render's free tier is for testing: it spins down after 15 minutes idle and takes about a minute to wake (render.com/docs/free).
services:
  - type: web
    name: ragx
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_DEVELOPER_PASSWORD
        sync: false
      - key: DEMO_VIEWER_PASSWORD
        sync: false
