[project]
name = "ragx"
version = "0.0.1"
description = "Advanced multimodal RAG over FastAPI and Pydantic docs, with evals"
requires-python = ">=3.12,<3.13"
# Pinned to the versions the phase 0 baseline was run with. More are added per phase (docs/06-IMPLEMENTATION-PLAN.md).
dependencies = [
  "fastembed==0.7.4",
  "rank-bm25==0.2.2",
  "numpy==2.5.4",
  "faiss-cpu==1.15.1",
  "httpx==0.28.1",
  "fastapi==0.162.0",
  "PyJWT==2.15.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.33",
  "uvicorn==0.54.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "PyYAML==6.0.3", "ruff==0.17.3"]
# Only for rebuilding the synthetic image and voice test sets and the icons (pyttsx3 needs Windows voices).
datasets = ["Pillow==11.3.0", "pyttsx3==2.99"]

[tool.ruff.lint]
select = ["E9", "F"]  # syntax errors and pyflakes only: real bugs, not style

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
