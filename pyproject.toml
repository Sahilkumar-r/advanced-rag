[project]
name = "ragx"
version = "0.0.1"
description = "Advanced multimodal RAG over FastAPI and Pydantic docs, with evals"
requires-python = ">=3.12,<3.13"
# Pinned to the versions the phase 0 baseline was run with. More are added per phase (docs/06-IMPLEMENTATION-PLAN.md).
dependencies = [
  "fastembed==0.7.4",
  "rank-bm25==0.2.2",
  "numpy==2.5.4",
  "faiss-cpu==1.15.1",
  "httpx==0.28.1",
  "fastapi==0.162.0",
  "PyJWT==2.15.1",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
