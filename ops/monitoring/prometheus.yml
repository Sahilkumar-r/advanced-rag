global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: ["/etc/prometheus/rules.yml"]
scrape_configs:
  - job_name: ragx
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["host.docker.internal:8000"]
