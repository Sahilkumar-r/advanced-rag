name: evals-nightly
# A small fixed sample of the generation eval. Skips, with a visible notice, when the API key secrets are not set.
# The online sample from live traffic is recorded by the app itself (sampled judge scores in Prometheus), not here:
# traces live on the server, not on this runner.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "About how many of the 43 fixed questions to run"
        default: "12"
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the keys are not configured
        id: keys
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: add GROQ_API_KEY and GEMINI_API_KEY as repository secrets to enable this run"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.keys.outputs.run == 'true'
        run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        if: steps.keys.outputs.run == 'true'
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Fetch the docs at the pinned commits
        if: steps.keys.outputs.run == 'true'
        run: python scripts/fetch_docs.py
      - name: Generation eval on a fixed sample (plain RAG)
        if: steps.keys.outputs.run == 'true'
        run: python scripts/run_generation_eval.py --cite --gate2 --systems plain_rag --sample "${{ inputs.sample || '12' }}" --tag nightly
      - name: Regression gate (tolerances are wide placeholders because the sample is small)
        if: steps.keys.outputs.run == 'true'
        shell: bash
        run: |
          python scripts/regression_gate.py --new eval/results/02-generation-nightly.json --base eval/results/02-generation-v3-bracketfix.json \
            --check systems.plain_rag.overall.faithfulness:0.10 --check systems.plain_rag.overall.refusal_correct:0.15 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.run == 'true'
        with:
          name: evals-nightly-${{ github.run_id }}
          path: eval/results/02-generation-nightly.json
          if-no-files-found: warn
